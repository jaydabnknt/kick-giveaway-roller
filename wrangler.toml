name = "toolbot"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[triggers]
crons = ["17 */6 * * *", "*/5 * * * *"]

[vars]
BOT_USERNAME = "ToolBot"
BOT_CHANNEL = "jaydab4ngnt"
SITE_URL = "https://toolbott.pages.dev/"

[[kv_namespaces]]
binding = "STORE"
id = "KV_ID_FILLED_BY_DEPLOY"

# Chat logs for mod tools (free D1 database). The deploy fills in the id, or drops this block if it can't make one.
[[d1_databases]]
binding = "DB"
database_name = "toolbot-chat"
database_id = "D1_ID_FILLED_BY_DEPLOY"
