name: token-probe
on:
  push:
    branches: [token-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which token is this
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "user verify:"; curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | head -c 400; echo
          ACC=$(curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts | grep -oE '"id":"[0-9a-f]{32}"' | head -1 | cut -d'"' -f4)
          echo "account: $ACC"
          echo "account verify:"; curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts/$ACC/tokens/verify | head -c 400; echo
