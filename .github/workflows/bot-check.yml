name: bot-check
on:
  push:
    branches: [bot-check]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - run: |
          npx -y wrangler@4 d1 execute toolbot-chat --remote --json --command "SELECT uid, name, last FROM users ORDER BY last DESC LIMIT 20" 2>&1 | tail -60
