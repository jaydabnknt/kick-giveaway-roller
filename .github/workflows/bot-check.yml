name: bot-check
on:
  push:
    branches: [bot-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://toolbot.toolbott.workers.dev
          echo "health:"; curl -s $B/health | head -c 800; echo
          echo "setup:"; curl -s $B/setup | head -c 3000; echo
          echo "health2:"; curl -s $B/health | head -c 800; echo
