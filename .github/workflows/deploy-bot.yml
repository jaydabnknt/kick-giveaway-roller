name: deploy-bot
on:
  push:
    branches: [bot]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          missing=""
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.KICK_CLIENT_ID }}" ] || missing="$missing KICK_CLIENT_ID"
          [ -n "${{ secrets.KICK_CLIENT_SECRET }}" ] || missing="$missing KICK_CLIENT_SECRET"
          if [ -n "$missing" ]; then echo "::notice::Not deploying yet, missing GitHub secrets:$missing"; echo "SKIP=1" >> $GITHUB_ENV; fi
      - name: One-time rename to ToolBot (storage name and workers.dev address)
        if: env.SKIP != '1'
        run: |
          API=https://api.cloudflare.com/client/v4; H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ACC=$(curl -s -H "$H" $API/accounts | grep -oE '"id":"[0-9a-f]{32}"' | head -1 | cut -d'"' -f4); echo "account $ACC"
          NS=$(curl -s -H "$H" "$API/accounts/$ACC/storage/kv/namespaces?per_page=100" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).result||[];const n=r.find(x=>x.title==="jd"+"bbot-store");console.log(n?n.id:"")})')
          if [ -n "$NS" ]; then curl -s -X PUT -H "$H" -H "content-type: application/json" "$API/accounts/$ACC/storage/kv/namespaces/$NS" -d '{"title":"toolbot-store"}' | head -c 300; echo; fi
          echo "subdomain before:"; curl -s -H "$H" $API/accounts/$ACC/workers/subdomain | head -c 300; echo
          for SUB in toolbot toolbotkick toolbot-kick; do
            R=$(curl -s -X PUT -H "$H" -H "content-type: application/json" $API/accounts/$ACC/workers/subdomain -d "{\"subdomain\":\"$SUB\"}"); echo "$SUB: $R" | head -c 400; echo
            echo "$R" | grep -q '"success":true' && break
          done
      - name: Make or find the bot's storage
        if: env.SKIP != '1'
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          ID=$(wrangler kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.title==="toolbot-store");console.log(n?n.id:"")})')
          if [ -z "$ID" ]; then
            wrangler kv namespace create toolbot-store > kv.txt 2>&1 || { cat kv.txt; exit 1; }
            ID=$(grep -oE '[0-9a-f]{32}' kv.txt | head -1)
          fi
          [ -n "$ID" ] || { echo "::error::Could not create KV storage"; exit 1; }
          sed -i "s/KV_ID_FILLED_BY_DEPLOY/$ID/" wrangler.toml
      - name: Make or find the chat log database
        if: env.SKIP != '1'
        run: |
          D1=$(wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.name==="toolbot-chat");console.log(n?n.uuid:"")}catch(e){console.log("")}})')
          if [ -z "$D1" ]; then
            wrangler d1 create toolbot-chat > d1.txt 2>&1 || cat d1.txt
            D1=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' d1.txt | head -1)
          fi
          if [ -n "$D1" ]; then sed -i "s/D1_ID_FILLED_BY_DEPLOY/$D1/" wrangler.toml
          else echo "::warning::Could not make the D1 chat log database (the Cloudflare API token may need D1 Edit permission). Deploying without chat logs."; sed -i '/^# Chat logs for mod tools/,$d' wrangler.toml; fi
      - name: Deploy
        if: env.SKIP != '1'
        run: |
          wrangler deploy 2>&1 | tee deploy.txt
          echo "BOT URL: $(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.txt | head -1)"
      - name: Set Kick keys
        if: env.SKIP != '1'
        run: |
          printf '%s' "${{ secrets.KICK_CLIENT_ID }}" | wrangler secret put KICK_CLIENT_ID
          printf '%s' "${{ secrets.KICK_CLIENT_SECRET }}" | wrangler secret put KICK_CLIENT_SECRET
