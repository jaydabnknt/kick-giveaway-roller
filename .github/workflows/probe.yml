name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kicklet API base
        run: |
          curl -sS -m 60 "https://r.jina.ai/https://kicklet.app/_nuxt/B3ESJgQP.js" -o b.js; wc -c b.js
          grep -o 'https://[a-zA-Z0-9.-]*kicklet[a-zA-Z0-9./_-]*' b.js | sort -u | head
          grep -o '.\{80\}commands.\{80\}' b.js | head -15
          grep -o '_nuxt/[A-Za-z0-9_.-]*\.js' b.js | sort -u | head -60 > chunks.txt; wc -l chunks.txt
          for c in $(cat chunks.txt); do curl -sS -m 30 "https://r.jina.ai/https://kicklet.app/$c" -o c.js; if grep -q 'commands' c.js; then echo "== $c"; grep -o '.\{100\}/commands.\{60\}' c.js | head -5; grep -o 'https://[a-zA-Z0-9.-]*kicklet[a-zA-Z0-9./_-]*' c.js | sort -u | head -3; fi; done
