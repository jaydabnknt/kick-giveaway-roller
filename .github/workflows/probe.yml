name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Subscribe JDBBot to chat
        run: |
          sleep 5
          B=https://jdbbot.jdbbot.workers.dev
          curl -sS -m 30 $B/health; echo
          curl -sS -m 30 $B/setup; echo
          curl -sS -m 30 -o /dev/null -w 'webhook unsigned -> %{http_code}\n' -X POST $B/webhook -d '{}'
          curl -sS -m 30 $B/health; echo
