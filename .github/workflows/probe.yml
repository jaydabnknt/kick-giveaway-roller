name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kicklet commands, other routes
        run: |
          for p in api/user/jaydab4ngnt/commands api/users/JayDaB4ngnt/commands api/channel/JayDaB4ngnt/commands api/channels/jaydab4ngnt/commands api/public/user/JayDaB4ngnt/commands api/v1/user/JayDaB4ngnt/commands api/user/JayDaB4ngnt api/commands/JayDaB4ngnt api/public/commands/JayDaB4ngnt; do echo "== $p"; curl -sS -m 20 -A "Mozilla/5.0" "https://kicklet.app/$p" | head -c 600; echo; done
          echo "== jina"; curl -sS -m 60 "https://r.jina.ai/https://kicklet.app/user/JayDaB4ngnt/commands" | head -c 6000; echo
