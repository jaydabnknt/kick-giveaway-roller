name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try Stake's slot list without a token
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36'
          Q1='{"operationName":"SlugKuratorGroup","variables":{"slug":"slots"},"query":"query SlugKuratorGroup($slug: String!) { slugKuratorGroup(slug: $slug) { id name slug gameCount } }"}'
          Q2='{"operationName":"SlugKuratorGroup","variables":{"slug":"slots","limit":5,"offset":0},"query":"query SlugKuratorGroup($slug: String!, $limit: Int!, $offset: Int!) { slugKuratorGroup(slug: $slug) { id name gameCount groupGamesList(limit: $limit, offset: $offset) { game { id name slug provider { name } } } } }"}'
          for BASE in https://stake.com https://stake.us https://stake.ac; do
            for Q in "$Q1" "$Q2"; do
              echo "=== $BASE"
              curl -sS -m 30 -X POST "$BASE/_api/graphql" -H 'Content-Type: application/json' -H "User-Agent: $UA" -H "Origin: $BASE" -H 'x-language: en' -d "$Q" -w '\nHTTP %{http_code}\n' | head -c 1200; echo
            done
          done
