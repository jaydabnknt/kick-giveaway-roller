name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kicklet commands, all pages
        run: |
          curl -sS -m 90 -H "X-Return-Format: html" "https://r.jina.ai/https://kicklet.app/user/JayDaB4ngnt/commands" -o r.html
          echo "== scripts"; grep -o 'src="[^"]*"' r.html | head -20
          echo "== api"; grep -o '"[^"]*api[^"]*"' r.html | sort -u | head -20
          for js in $(grep -o 'src="[^"]*\.js"' r.html | sed 's/src="//;s/"$//' | head -8); do case "$js" in http*) u=$js;; *) u="https://kicklet.app$js";; esac; echo "== $u"; curl -sS -m 60 "https://r.jina.ai/$u" | grep -o '[`"'"'"'][^`"'"'"']*/api/[^`"'"'"']*[`"'"'"']' | sort -u | head -30; done
          echo "== sel"; curl -sS -m 90 -H "X-Wait-For-Selector: body" "https://r.jina.ai/https://kicklet.app/user/JayDaB4ngnt/commands?page=2" | sed -n '/Commands/,$p' | head -40
