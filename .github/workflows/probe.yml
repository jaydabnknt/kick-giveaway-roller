name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check JDBBot
        run: |
          sleep 60
          B=https://jdbbot.jdbbot.workers.dev
          curl -sS -m 20 $B/health -w '\nHTTP %{http_code}\n'
          curl -sS -m 20 -o /dev/null -D - $B/login | grep -i -E '^(HTTP|location)' | sed -E 's/(state|code_challenge)=[^&]*/\1=X/g'
          curl -sS -m 20 -o /dev/null -w 'site HTTP %{http_code}\n' https://jaydabnknt.github.io/kick-giveaway-roller/
