name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can the bot find the chatroom, and does Kick's direct lookup work
        run: |
          sleep 40
          echo "== worker /room"; curl -sS -m 30 "https://jdbbot.jdbbot.workers.dev/room?ch=jaydab4ngnt"; echo
          echo "== direct"; curl -sS -m 30 -A "Mozilla/5.0" "https://kick.com/api/v2/channels/jaydab4ngnt" | grep -o '"chatroom":{[^}]*' | head -c 300; echo
