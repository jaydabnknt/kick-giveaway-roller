name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which raid events does Kick accept
        run: |
          sleep 70
          for n in channel.raided channel.raid channel.hosted channel.host livestream.hosted channel.followed; do
            echo "== $n"; curl -sS -m 30 "https://jdbbot.jdbbot.workers.dev/try-event?name=$n"; echo
          done
