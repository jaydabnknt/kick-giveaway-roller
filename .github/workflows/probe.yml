name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read the wrapper's game-list query
        run: |
          mkdir pkg && cd pkg && pip download --no-deps -q stakeapi-codestats && ls
          for f in *.whl; do python -m zipfile -e "$f" x; done
          for f in *.tar.gz; do tar xzf "$f" 2>/dev/null || true; done
          echo "=== files"; find . -name '*.py' | head -30
          echo "=== kurator-related code"
          grep -rn -i -B2 -A45 'kurator' --include=*.py . | head -220
