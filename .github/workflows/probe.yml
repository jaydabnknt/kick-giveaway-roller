name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read slot.report registration form
        run: |
          curl -sS -m 30 https://slot.report/api/register -o reg.html
          echo "=== forms"; grep -io '<form[^>]*>' reg.html | head
          echo "=== inputs"; grep -io '<input[^>]*>' reg.html | head -20
          echo "=== fetch/api calls"; grep -o "fetch([^)]*)" reg.html | head; grep -o '"/api/[^"]*"' reg.html | sort -u | head -30; grep -o "'/api/[^']*'" reg.html | sort -u | head -30
          echo "=== script snippets"; tr '\n' ' ' < reg.html | grep -o '<script[^>]*>[^<]\{0,3000\}' | grep -i 'regist\|check\|key' | head -c 6000
