name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check ntfy relay and site
        run: |
          T=kgtprobe$RANDOM$RANDOM
          curl -sS -m 20 -D - -o pub.txt -X POST -H 'Origin: https://jaydabnknt.github.io' -d '{"t":"g","test":1}' https://ntfy.sh/$T | grep -i -E '^(HTTP|access-control|x-ratelimit|retry)'; head -c 400 pub.txt; echo
          curl -sS -m 20 "https://ntfy.sh/$T/json?poll=1&since=10m" | head -c 400; echo
          (curl -sS -m 8 -D - -H 'Origin: https://jaydabnknt.github.io' "https://ntfy.sh/$T/sse?since=10m" | head -c 700) ; echo
          curl -sS -m 20 -o /dev/null -w 'site %{http_code}\n' "https://jaydabnknt.github.io/kick-giveaway-roller/?overlay=giveaway&k=kgttest"
          curl -sS -m 20 https://jaydabnknt.github.io/kick-giveaway-roller/ | grep -c 'ntfy.sh'
