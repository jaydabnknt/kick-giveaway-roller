name: kick-key-probe
on:
  push:
    branches: [kick-key-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Badge status
        run: |
          curl -sS -m 30 "https://jdbbot.jdbbot.workers.dev/channel?ch=jaydab4ngnt" | grep -o '"enabled":[a-z]*,"badge":[a-z]*'; echo
          curl -sS -m 30 "https://jdbbot.jdbbot.workers.dev/health"; echo
